[package]
edition = "2021"
rust-version = "1.82"
name = "mdbook"
version = "0.4.52"
authors = [
    "Mathieu David <mathieudavid@mathieudavid.org>",
    "Michael-F-Bryan <michaelfbryan@gmail.com>",
    "Matt Ickstadt <mattico8@gmail.com>",
]
build = false
exclude = ["/guide/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Creates a book from markdown files"
documentation = "https://rust-lang.github.io/mdBook/index.html"
readme = "README.md"
keywords = [
    "book",
    "gitbook",
    "rustbook",
    "markdown",
]
license = "MPL-2.0"
repository = "https://github.com/rust-lang/mdBook"

[features]
default = [
    "watch",
    "serve",
    "search",
]
search = [
    "dep:elasticlunr-rs",
    "dep:ammonia",
]
serve = [
    "dep:futures-util",
    "dep:tokio",
    "dep:axum",
    "dep:tower-http",
]
watch = [
    "dep:notify",
    "dep:notify-debouncer-mini",
    "dep:ignore",
    "dep:pathdiff",
    "dep:walkdir",
]

[lib]
name = "mdbook"
path = "src/lib.rs"

[[bin]]
name = "mdbook"
path = "src/main.rs"
doc = false

[[example]]
name = "nop-preprocessor"
path = "examples/nop-preprocessor.rs"
test = true

[[example]]
name = "remove-emphasis"
crate-type = ["lib"]
path = "examples/remove-emphasis/test.rs"
test = true

[[test]]
name = "gui"
crate-type = ["bin"]
path = "tests/gui/runner.rs"
test = false
harness = false

[[test]]
name = "testsuite"
path = "tests/testsuite/main.rs"

